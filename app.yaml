runtime: nodejs20

instance_class: F2

handlers:
  # Serve all static files (css, js, images, etc.)
  - url: /(.*\.(css|js|json|ico|png|jpg|jpeg|svg|gif))$
    static_files: dist/\1
    upload: dist/(.*\.(css|js|json|ico|png|jpg|jpeg|svg|gif))$

  # Catch all handler to index.html
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
